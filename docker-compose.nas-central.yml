x-fapaifang-image: &fapaifang-image
  build:
    context: .
    dockerfile: ${FAPAI_DOCKERFILE:-Dockerfile}
    args:
      PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim@sha256:a0e2dd78cc679ddfffea960fe45ecfcff9ac2f68d67917a0edfcde5c2100151b}
      NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85}
      BASE_IMAGE: ${FAPAI_BASE_IMAGE:-fapaifang-collector:local}
      FAPAI_BUILD_VERSION: ${FAPAI_BUILD_VERSION:-development}
      FAPAI_BUILD_COMMIT: ${FAPAI_BUILD_COMMIT:-unknown}
      FAPAI_BUILD_TIME: ${FAPAI_BUILD_TIME:-unknown}
      FAPAI_SOURCE_DIGEST: ${FAPAI_SOURCE_DIGEST:-unknown}
  env_file:
    - ${FAPAI_NAS_ENV_FILE:-env.nas.local}
  image: ${FAPAI_IMAGE:-fapaifang-collector:local}

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fapaifang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FAPAI_POSTGRES_DB:-fapaifang}
      POSTGRES_USER: ${FAPAI_POSTGRES_USER:-fapaifang}
      POSTGRES_PASSWORD: ${FAPAI_POSTGRES_PASSWORD:-fapaifang}
    ports:
      - "${FAPAI_POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FAPAI_POSTGRES_USER:-fapaifang} -d ${FAPAI_POSTGRES_DB:-fapaifang}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - type: bind
        source: ${FAPAI_NAS_DATA_ROOT:?set FAPAI_NAS_DATA_ROOT}/postgres
        target: /var/lib/postgresql/data

  crow-api:
    <<: *fapaifang-image
    container_name: crow-api
    restart: unless-stopped
    labels:
      org.opencontainers.image.version: ${FAPAI_BUILD_VERSION:-development}
      org.opencontainers.image.revision: ${FAPAI_BUILD_COMMIT:-unknown}
      io.fapaifang.source-digest: ${FAPAI_SOURCE_DIGEST:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FAPAI_BUILD_VERSION: ${FAPAI_BUILD_VERSION:-development}
      FAPAI_BUILD_COMMIT: ${FAPAI_BUILD_COMMIT:-unknown}
      FAPAI_BUILD_TIME: ${FAPAI_BUILD_TIME:-unknown}
      FAPAI_SOURCE_DIGEST: ${FAPAI_SOURCE_DIGEST:-unknown}
      FAPAI_RUN_MODE: api
      FAPAI_API_PORT: 8001
      FAPAI_API_TLS_CERT_FILE: ${FAPAI_API_TLS_CERT_FILE:-}
      FAPAI_API_TLS_KEY_FILE: ${FAPAI_API_TLS_KEY_FILE:-}
      FAPAI_COLLECTION_WORKER_TOKEN_FILE: ${FAPAI_COLLECTION_WORKER_TOKEN_FILE:-/data/secrets/collection-worker.token}
      FAPAI_ENGINE_OPERATOR_TOKEN_FILE: ${FAPAI_ENGINE_OPERATOR_TOKEN_FILE:-/data/secrets/engine-operator.token}
      FAPAI_ENGINE_AGENT_TOKEN_FILE: ${FAPAI_ENGINE_AGENT_TOKEN_FILE:-/data/secrets/engine-agent.token}
      FAPAI_DB_URL: ${FAPAI_DB_URL:-postgresql+psycopg://fapaifang:fapaifang@postgres:5432/fapaifang}
      FAPAI_DB_SCHEMA_GUARD: ${FAPAI_API_DB_SCHEMA_GUARD:-0}
      FAPAI_DB_AUTO_CREATE: ${FAPAI_API_DB_AUTO_CREATE:-0}
      FAPAI_DB_ENABLE_POSTGIS: ${FAPAI_API_DB_ENABLE_POSTGIS:-0}
      FAPAI_COLLECTION_API_LIGHTWEIGHT_STATUS: ${FAPAI_COLLECTION_API_LIGHTWEIGHT_STATUS:-1}
      FAPAI_SOLVER_STATE_DIR: ${FAPAI_SOLVER_STATE_DIR:-/data/datas}
      FAPAI_REAL_TAOBAO_AUTO_SOLVER_ENABLED: ${FAPAI_REAL_TAOBAO_AUTO_SOLVER_ENABLED:-0}
      FAPAI_SOLVER_DETAIL_PROGRESS_GRACE_SECONDS: ${FAPAI_SOLVER_DETAIL_PROGRESS_GRACE_SECONDS:-180}
      FAPAI_SOLVER_DETAIL_PROGRESS_GRACE_MIN_ITEMS: ${FAPAI_SOLVER_DETAIL_PROGRESS_GRACE_MIN_ITEMS:-1}
      FAPAI_SOLVER_FORCE_RESET_REPORT_GRACE_SECONDS: ${FAPAI_SOLVER_FORCE_RESET_REPORT_GRACE_SECONDS:-180}
      FAPAI_NAS_AUTH_RECOVERY_ENABLED: ${FAPAI_NAS_AUTH_RECOVERY_ENABLED:-1}
      FAPAI_NAS_AUTH_RECOVERY_STALL_SECONDS: ${FAPAI_NAS_AUTH_RECOVERY_STALL_SECONDS:-1800}
      FAPAI_NAS_AUTH_RECOVERY_BLOCKED_STALL_SECONDS: ${FAPAI_NAS_AUTH_RECOVERY_BLOCKED_STALL_SECONDS:-300}
      FAPAI_NAS_AUTH_RECOVERY_POLL_SECONDS: ${FAPAI_NAS_AUTH_RECOVERY_POLL_SECONDS:-60}
      FAPAI_NAS_AUTH_RECOVERY_PC1_TIMEOUT_SECONDS: ${FAPAI_NAS_AUTH_RECOVERY_PC1_TIMEOUT_SECONDS:-1800}
      FAPAI_NAS_AUTH_RECOVERY_PC2_TIMEOUT_SECONDS: ${FAPAI_NAS_AUTH_RECOVERY_PC2_TIMEOUT_SECONDS:-600}
      FAPAI_NAS_AUTH_RECOVERY_VERIFY_TIMEOUT_SECONDS: ${FAPAI_NAS_AUTH_RECOVERY_VERIFY_TIMEOUT_SECONDS:-600}
      FAPAI_NAS_AUTH_RECOVERY_COOLDOWN_SECONDS: ${FAPAI_NAS_AUTH_RECOVERY_COOLDOWN_SECONDS:-1800}
      FAPAI_NAS_AUTH_RECOVERY_STATE_PATH: /data/datas/nas-auth-recovery.json
      FAPAI_NAS_AUTH_RECOVERY_TOKEN_FILE: /data/secrets/nas-auth-recovery.token
      FAPAI_COOKIE_SNAPSHOT_ROOT: ${FAPAI_COOKIE_SNAPSHOT_ROOT:-/data/shared}
      # The interpolation value above is the NAS host path; inside the
      # container artifact resolution must use the mounted target path.
      FAPAI_SHARED_ARTIFACT_ROOT: /data/shared
    ports:
      - "${FAPAI_API_HOST_BIND_ADDRESS:-127.0.0.1}:${FAPAI_API_HOST_PORT:-9520}:8001"
    volumes:
      - type: bind
        source: ${FAPAI_NAS_DATA_ROOT:?set FAPAI_NAS_DATA_ROOT}/output
        target: /data/output
      - type: bind
        source: ${FAPAI_SHARED_ARTIFACT_ROOT:-${FAPAI_NAS_DATA_ROOT:?set FAPAI_NAS_DATA_ROOT}}
        target: /data/shared
      - type: bind
        source: ${FAPAI_NAS_DATA_ROOT:?set FAPAI_NAS_DATA_ROOT}/datas
        target: /data/datas
      - type: bind
        source: ${FAPAI_NAS_DATA_ROOT:?set FAPAI_NAS_DATA_ROOT}/jobs
        target: /data/jobs
      - type: bind
        source: ${FAPAI_NAS_DATA_ROOT:?set FAPAI_NAS_DATA_ROOT}/secrets
        target: /data/secrets
