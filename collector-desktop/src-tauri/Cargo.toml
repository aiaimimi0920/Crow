[package]
name = "fapaifang_collector_desktop"
version = "0.1.0"
description = "FapaiFang collection observer desktop application"
authors = ["FapaiFang"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"
default-run = "fapaifang_collector_desktop"

[lib]
name = "fapaifang_collector_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
