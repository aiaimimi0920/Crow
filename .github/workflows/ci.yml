  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collector-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - run: cargo +1.90.0 fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo +1.90.0 test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer with the pinned CLI
        run: npm run tauri:build -- --debug --bundles nsis --ci -- --locked
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: .
      - run: python -m pytest -q tools/test/test_operator_entrypoint_main_batch.py tools/test/test_project_data_paths.py tools/test/test_project_data_path_entrypoints.py tools/test/test_desktop_auth_launcher.py tools/test/test_desktop_auth_bundle.py tools/test/test_project_environment.py tools/test/test_project_environment_runtime.py tools/test/test_project_environment_injected.py tools/test/test_desktop_environment_aliases.py
        working-directory: .
  desktop-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
        working-directory: collector-desktop
      - run: npx playwright install --with-deps chromium
        working-directory: collector-desktop
      - run: npm run test:smoke
        working-directory: collector-desktop
  game:
    name: Game web clean build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: game/web-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game/web-app/package-lock.json
      - run: npm ci
      - run: npm run build
