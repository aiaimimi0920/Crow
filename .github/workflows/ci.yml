name: Crow quality
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * *'
concurrency:
  group: crow-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_DB: crow_quality
          POSTGRES_USER: quality
          POSTGRES_PASSWORD: isolated_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -c "import cv2, ddddocr, numpy, onnxruntime"
      - run: python scripts/generate_auth_recovery_codes.py --check
      - run: python scripts/run_quality_tests.py --suite collection-storage
      - run: python scripts/run_quality_tests.py --suite collection-runtime
      - run: python scripts/run_quality_tests.py --suite collection-detail
      - run: python scripts/run_quality_tests.py --suite collection-maintenance
      - run: python scripts/run_quality_tests.py --suite collection-delivery
      - run: docker compose version
      - run: python -m pytest -q tools/test/test_compose_cli_compatibility.py
        env:
          CROW_TEST_COMPOSE: "1"
      - run: python scripts/run_quality_tests.py --suite fast
      - run: python scripts/run_quality_tests.py --suite security
      - run: python scripts/run_quality_tests.py --suite captcha
      - run: python scripts/run_quality_tests.py --suite llm
      - run: python scripts/run_quality_tests.py --suite postgres
        env:
          CROW_TEST_POSTGRES_URL: postgresql+psycopg://quality:isolated_ci_only@127.0.0.1:5432/crow_quality
      - run: node --test scripts/tests/effective-code-lines.test.mjs scripts/tests/build-userscript.test.mjs scripts/tests/userscript-generated-gate.test.mjs scripts/tests/userscript-api.test.mjs scripts/tests/userscript-url-security.test.mjs scripts/tests/userscript-runtime-security.test.mjs scripts/tests/userscript-equivalence.test.mjs
      - run: git diff --check
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collector-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - run: cargo +1.90.0 test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer with the pinned CLI
        run: npm run tauri:build -- --debug --bundles nsis --ci -- --locked
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: .
      - run: python -m pytest -q tools/test/test_operator_entrypoint_main_batch.py tools/test/test_project_data_paths.py tools/test/test_project_data_path_entrypoints.py tools/test/test_desktop_auth_launcher.py tools/test/test_desktop_auth_bundle.py tools/test/test_project_environment.py tools/test/test_project_environment_runtime.py tools/test/test_project_environment_injected.py tools/test/test_desktop_environment_aliases.py tools/test/test_powershell_environment_aliases.py tools/test/test_project_environment_compose.py tools/test/test_desktop_api_configuration.py tools/test/test_compose_environment.py tools/test/test_compose_arguments.py tools/test/test_compose_environment_file.py tools/test/test_pc2_operator_environment_bundle.py tools/test/test_pc2_operator_environment_readers.py tools/test/test_pc2_analysis_environment_aliases.py
        working-directory: .
  desktop-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
        working-directory: collector-desktop
      - run: npx playwright install --with-deps chromium
        working-directory: collector-desktop
      - run: npm run build && npx playwright test tests/configuration-compatibility.spec.ts
        if: github.event_name == 'pull_request'
        working-directory: collector-desktop
      - run: npm run test:smoke
        if: github.event_name != 'pull_request'
        working-directory: collector-desktop
  game:
    name: Game web clean build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: game/web-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game/web-app/package-lock.json
      - run: npm ci
      - run: npm run build
