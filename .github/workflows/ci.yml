name: Crow quality
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * *'
concurrency:
  group: crow-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_DB: crow_quality
          POSTGRES_USER: quality
          POSTGRES_PASSWORD: isolated_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -c "import cv2, ddddocr, numpy, onnxruntime"
      - run: python scripts/generate_auth_recovery_codes.py --check
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B src/collection_api_credentials.py tools/test/test_collection_api_credentials.py tools/internal_api_http.py src/project_environment.py tools/test/test_project_environment.py tools/test/test_project_environment_runtime.py
      - run: python -m ruff format --check src/collection_api_credentials.py tools/test/test_collection_api_credentials.py tools/internal_api_http.py src/project_environment.py tools/test/test_project_environment.py tools/test/test_project_environment_runtime.py
      - run: python -m mypy --strict --explicit-package-bases --follow-imports skip src/collection_api_credentials.py src/project_environment.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B tools/pc1_desktop_recovery.py tools/pc1_recovery_request.py tools/test/test_recovery_client_transport.py tools/test/test_pc1_watcher_transport.py
