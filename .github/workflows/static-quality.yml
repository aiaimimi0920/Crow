name: Static quality reports
on:
  pull_request:
  push:
  schedule:
    - cron: '20 19 * * *'
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail on findings for release validation
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: static-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python scripts/run_static_checks.py python .security-results/python.json
      - name: Preserve all static finding locations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Python static findings
          path: .security-results/python.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Enforce release static gate
        if: ${{ startsWith(github.base_ref, 'release/') || github.base_ref == 'production' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && inputs.enforce) }}
        run: python scripts/run_static_checks.py enforce .security-results/python.json
  source-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python3 scripts/run_static_checks.py effective .security-results/effective.json
      - name: Preserve size findings and complete checker report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Source size findings
          path: .security-results/effective*.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Enforce release size gate
        if: ${{ startsWith(github.base_ref, 'release/') || github.base_ref == 'production' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && inputs.enforce) }}
        run: python3 scripts/run_static_checks.py enforce .security-results/effective.json
  desktop-static:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector-desktop/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - run: npm ci
        working-directory: collector-desktop
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - run: python scripts/run_static_checks.py desktop .security-results/desktop.json
      - name: Preserve all desktop static finding locations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Desktop static findings
          path: .security-results/desktop.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Enforce release desktop static gate
        if: ${{ startsWith(github.base_ref, 'release/') || github.base_ref == 'production' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && inputs.enforce) }}
        run: python scripts/run_static_checks.py enforce .security-results/desktop.json
