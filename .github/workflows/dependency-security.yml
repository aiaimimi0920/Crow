name: Dependency Security
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  osv:
    name: Scan all committed dependency locks
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=requirements.txt:./requirements.lock
        --lockfile=requirements.txt:./requirements-dev.lock
        --lockfile=./collector-desktop/package-lock.json
        --lockfile=./collector-desktop/src-tauri/Cargo.lock
        --lockfile=./game/web-app/package-lock.json
      upload-sarif: true
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write
