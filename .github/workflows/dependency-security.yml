name: Dependency Security
on:
  pull_request:
  push:
    branches: [master, production, 'release/**']
    tags: ['v*']
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail on findings for release validation
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  osv-scan:
    name: Scan all committed dependency locks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan and validate complete OSV results
        run: python3 scripts/run_osv_scan.py scan .security-results/osv
      - name: Preserve complete scan evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OSV Scanner results
          path: .security-results/osv/
          retention-days: 5
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload all findings to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .security-results/osv/results.sarif
          wait-for-processing: true
      - name: Enforce release dependency gate
        if: ${{ startsWith(github.base_ref, 'release/') || github.base_ref == 'production' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && inputs.enforce) }}
        run: python3 scripts/run_osv_scan.py enforce .security-results/osv

