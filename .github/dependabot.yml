version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-compatible:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories:
      - /collector-desktop
      - /game/web-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      npm-compatible:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /collector-desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      rust-compatible:
        patterns: ['*']
        update-types: [minor, patch]
